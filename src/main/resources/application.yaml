spring:
  application:
    name: get_jobs
  profiles:
    active: dev
  info:
    app:
      name: Get Jobs
      version: 2.0.1
      description: https://github.com/loks666/get_jobs
  banner:
    charset: UTF-8
    location: classpath:banner.txt
  datasource:
    url: jdbc:sqlite:./db/getjobs.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      connection-test-query: SELECT 1
  sql:
    init:
      mode: never  # 数据库文件已存在，不需要自动初始化
  output:
    ansi:
      enabled: always

# 服务器配置
server:
  port: 9527  # 后端 API 固定端口（别用 9679：落在 Windows Hyper-V 保留段 9628-9727 里，绑不上）

automation:
  login-check:
    logged-in-interval-ms: 30000  # 已登录后减少 DOM 检测；扫码期间仍每 3 秒检测

# 启动时自动唤起积分客户端并领取每日奖励。
# WorkBuddy 使用 Electron CDP + Playwright 连接客户端页面，不需要 macOS“辅助功能”权限。
reward-claim:
  enabled: true
  workbuddy:
    enabled: true
    cdp-automation: true
    cdp-port: 9229
  qoder:
    enabled: true
  close-after-confirmed: true

# 日志配置
logging:
  level:
    root: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level){highlight} %clr(%logger{36}){cyan} %clr(-){faint} %msg%n"
  file:
    name: ./target/logs/get-jobs.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: true  # 打开 MyBatis Plus 启动 banner
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml
